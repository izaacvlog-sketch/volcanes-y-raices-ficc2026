<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><meta name="description" content="Mapa 360 interactivo de los espacios del Festival Internacional del Café Cacahoatán 2026."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title data-keep>Mapa 360 · FICC 2026</title>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<style data-keep>
/* Layout: esfera 360 grande a la izquierda; panel de zonas y edición a la derecha (abajo en teléfono). Un solo tema: café oscuro del FICC */
:root{
  --coffee:#2A150B; --coffee-2:#3B1E10; --coffee-3:#4A2817;
  --wine:#8B1A1A; --crema:#F3E3C0; --crema-2:#E8D2A2; --oro:#D9A23A; --hoja:#3E7A34;
  --muted:rgba(243,227,192,.68); --line:rgba(243,227,192,.16); --field:rgba(243,227,192,.07);
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Work Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--coffee);color:var(--crema);font-family:var(--body);font-size:15px;line-height:1.5}
.app{display:flex;flex-direction:column;min-height:100%;padding-inline:16px;padding-block:12px 18px;gap:12px;max-width:1440px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:52px;height:52px;object-fit:contain;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;line-height:1.15;text-wrap:balance}
.brand h1 em{color:var(--oro);font-style:italic}
.brand p{margin:0;color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.btn{font:inherit;font-weight:600;font-size:.86rem;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--crema);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--oro)}
.btn.primary{background:var(--oro);border-color:var(--oro);color:var(--coffee)}
.btn.primary:hover{background:#E6B24C}
.btn.wine{background:var(--wine);border-color:var(--wine);color:var(--crema)}
.btn.danger{color:#F0A08F;border-color:rgba(240,160,143,.4)}
.btn.danger.armed{background:#B23A2A;color:#fff;border-color:#B23A2A}
.btn[aria-pressed="true"]{background:var(--crema);color:var(--coffee);border-color:var(--crema)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;flex:1;min-height:0;align-items:start}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#140A05;height:min(80vh,760px);min-height:480px;touch-action:none;cursor:grab;border:1px solid var(--line)}
.stage.dragging{cursor:grabbing}
.stage.moving{cursor:move}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;top:12px;left:12px;background:rgba(20,10,5,.66);color:var(--crema);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;pointer-events:none;border:1px solid var(--line)}
.hint{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;pointer-events:none}
.hint span{background:rgba(20,10,5,.74);border:1px solid var(--oro);color:var(--crema);font-size:.84rem;padding:6px 14px;border-radius:999px;text-align:center}
.pano-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#120a05;color:var(--crema);font-size:.85rem;letter-spacing:.04em;z-index:4;pointer-events:none}
.pano-load[hidden]{display:none}
.pano-load.soft{inset:auto auto 12px 12px;flex-direction:row;gap:8px;background:rgba(20,10,5,.66);padding:6px 12px;border-radius:999px;font-size:.72rem;border:1px solid var(--line)}
.pano-load.soft .pl-txt::after{content:" · alta calidad"}
.pl-spin{width:26px;height:26px;border-radius:50%;border:2px solid rgba(243,227,192,.25);border-top-color:#D9A23A;animation:plspin .8s linear infinite}
.pano-load.soft .pl-spin{width:12px;height:12px}
@keyframes plspin{to{transform:rotate(360deg)}}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--crema);color:var(--coffee);padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:600;pointer-events:none;max-width:calc(100% - 24px);text-align:center;z-index:5}
.msg.err{background:#F0A08F}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--coffee-2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:11px;min-width:0}
.box h2{margin:0;font-family:var(--body);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--oro)}
.box p{margin:0}
.save{border-color:var(--oro);background:linear-gradient(180deg,rgba(217,162,58,.16),rgba(217,162,58,.05))}
.save p{font-size:.88rem}
.field{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:500}
.field input[type=text],.field select{font:inherit;font-size:.95rem;color:var(--crema);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.field select option{background:var(--coffee-2);color:var(--crema)}
.field input[type=range]{width:100%;accent-color:var(--oro)}
.range-row{display:flex;justify-content:space-between;align-items:baseline}
.range-row b{font-variant-numeric:tabular-nums;color:var(--crema);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.list li button{width:100%;font:inherit;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);color:var(--crema);padding:10px 4px;cursor:pointer}
.list li button:hover{background:var(--field)}
.list li button.sel{background:rgba(217,162,58,.14)}
.list .name{flex:1;min-width:0;font-family:var(--display);font-size:1.02rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sub{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.free{color:var(--oro);border-color:var(--oro)}
.empty{color:var(--muted);font-size:.86rem}
.note{font-size:.78rem;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--field);overflow:hidden}
.meter i{display:block;height:100%;background:var(--oro)}
.wa{display:flex;flex-direction:column;gap:6px}
.wa small{color:var(--muted);font-size:.78rem}
.drawbar{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--coffee-2);border:1px solid var(--oro);border-radius:14px;padding:10px 12px;cursor:default;z-index:4}
.drawbar span{flex:1 1 200px;font-size:.88rem}
.zcard{position:absolute;left:12px;bottom:12px;width:min(320px,calc(100% - 24px));background:var(--coffee-2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:default;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:4}
.zcard h3{margin:0;font-family:var(--display);font-size:1.4rem;line-height:1.1}
.zcard p{margin:0;color:var(--muted);font-size:.9rem}
.zcard .x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:4px 8px;line-height:1}
.zst{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.zst::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.zst.disponible{color:#7FD38E}.zst.apartado{color:var(--oro)}.zst.ocupado{color:#F0A08F}
.zpin{position:absolute;transform:translate(-50%,-50%);font:700 .74rem/1 var(--body);padding:4px 7px;border-radius:999px;border:1.5px solid #fff;color:#fff;cursor:pointer;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.zpin.disponible{background:#2E8B45}.zpin.apartado{background:#B07D1E}.zpin.ocupado{background:#8B1A1A}
.zpin.sel{outline:3px solid #fff;outline-offset:1px;z-index:2}
.stage.drawing{cursor:crosshair}
.qbar{position:absolute;left:0;top:0;width:min(330px,calc(100% - 20px));background:rgba(42,21,11,.94);border:1px solid var(--oro);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;z-index:5;cursor:default;box-shadow:0 10px 26px rgba(0,0,0,.5);touch-action:manipulation}
.qaxes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.qax{font:inherit;font-size:.78rem;font-weight:600;padding:7px 4px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--crema);cursor:pointer}
.qax[aria-pressed="true"]{background:var(--oro);color:var(--coffee);border-color:var(--oro)}
.qrow{display:flex;align-items:center;gap:8px}
.qrow input[type=range]{flex:1;min-width:0;accent-color:var(--oro);height:28px}
.qstep{font:inherit;font-size:1.2rem;font-weight:700;width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--crema);cursor:pointer;flex:none}
.qval{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:.86rem}
.qrow .btn{flex:1}
.zedit{display:flex;flex-direction:column;gap:8px}
.zcard.top{top:12px;bottom:auto}
.vh{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:transparent;border:none;padding:0;touch-action:none;cursor:grab;z-index:3}
.vh::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--oro);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.55)}
.vh.active::after{inset:4px;background:#fff;border-color:var(--oro)}
.vh:active{cursor:grabbing}
.zedit .row{gap:6px}
.zedit input{font:inherit;font-size:.95rem;color:var(--crema);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.zedit label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted)}
.vtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.vtab{font:inherit;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--crema);cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2}
.vtab small{font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vtab[aria-selected="true"]{background:var(--oro);border-color:var(--oro);color:var(--coffee)}
.vtab[aria-selected="true"] small{color:rgba(42,21,11,.7)}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--oro)}
html.embed,html.embed body{height:auto}
.embed .app{padding-inline:0;padding-block:0;min-height:0}
.embed header{display:none}
.embed .stage{height:clamp(440px,58vw,680px);min-height:0}
@media (max-width:880px){
  .embed .stage{height:460px}
  .layout{grid-template-columns:1fr}
  .stage{min-height:0;height:62svh;max-height:620px}
}
</style>

<template id="tpl" data-keep>
<div class="app">
  <header>
    <div class="brand">
      <img id="logoImg" alt="Logo del Festival Internacional del Café Cacahoatán 2026" width="52" height="52">
      <div>
        <p>FICC 2026 · Parque Central, Cacahoatán</p>
        <h1 id="pTitle">Mapa de <em>zonas</em> del festival</h1>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="previewBtn" aria-pressed="false" hidden>Vista del público</button>
      <button class="btn" id="editBtn" aria-pressed="false" hidden>Editar</button>
    </div>
  </header>

  <nav class="vtabs" id="vtabs" role="tablist" aria-label="Vistas 360 del festival"></nav>

  <div class="layout">
    <section class="stage" id="stage" aria-label="Vista 360 del Parque Central con las zonas del festival">
      <div class="tag" id="tag" hidden>Ejemplo · sube tu foto 360 del parque</div>
      <div id="zpins"></div>
      <div id="vhandles"></div>
      <div class="drawbar" id="drawbar" hidden>
        <span id="drawText">Toca las esquinas del puesto, una por una.</span>
        <button class="btn" id="dUndo">Deshacer punto</button>
        <button class="btn primary" id="dDone">Cerrar zona</button>
        <button class="btn" id="dCancel">Cancelar</button>
      </div>
      <div class="zcard" id="zcard" hidden></div>
      <div class="qbar" id="qbar" hidden>
        <div class="qaxes">
          <button class="qax" data-ax="roll">Rotar</button>
          <button class="qax" data-ax="yaw">Girar</button>
          <button class="qax" data-ax="tilt">Inclinar</button>
          <button class="qax" data-ax="size">Tamaño</button>
        </div>
        <div class="qrow">
          <button class="qstep" id="qMinus" aria-label="Menos">−</button>
          <input type="range" id="qRange" aria-label="Ajuste">
          <button class="qstep" id="qPlus" aria-label="Más">+</button>
          <span class="qval" id="qVal"></span>
        </div>
        <div class="qrow">
          <button class="btn primary" id="qAnchor">Anclar</button>
          <button class="btn" id="qSpin" aria-pressed="false">Vueltas</button>
          <button class="btn" id="qClose">Listo</button>
        </div>
      </div>
      <div class="hint" id="hint" hidden><span id="hintText"></span></div>
      <div class="msg" id="msg" hidden></div>
      <div class="pano-load" id="panoLoad" hidden><span class="pl-spin"></span><span class="pl-txt">Cargando vista…</span></div>
    </section>

    <aside class="panel">
      <div class="box save" id="saveBox" hidden>
        <p>Tienes cambios sin guardar. Al guardar, el público verá la versión nueva.</p>
        <button class="btn primary" id="saveBtn">Guardar cambios</button>
      </div>

      <div class="box" id="addBox" hidden>
        <h2>Agregar a la esfera</h2>
        <button class="btn primary" id="addZone">+ Delinear zona o puesto</button>
        <p class="note">Toca las esquinas del área sobre la foto, una por una. Queda pintada en verde.</p>
        <label class="field">Texto principal<input type="text" id="nTitle" maxlength="40" placeholder="Ej. Zona de Café"></label>
        <label class="field">Texto pequeño (opcional)<input type="text" id="nSub" maxlength="40" placeholder="Ej. Zona 3 · Cafeterías"></label>
        <div class="row">
          <button class="btn primary" id="addText">+ Agregar texto 3D</button>
          <button class="btn" id="addLogo">+ Logo FICC</button>
          <label class="btn" for="addImgInput">+ Imagen</label>
          <input id="addImgInput" type="file" accept="image/png,image/webp,image/jpeg" hidden>
        </div>
        <p class="note">Aparece al centro de lo que estás viendo. Arrástralo a su lugar y toca <b>Anclar</b>.</p>
      </div>

      <div class="box" id="selBox" hidden>
        <h2 id="selHead">Elemento</h2>
        <div id="selTextFields">
          <label class="field">Texto principal<input type="text" id="sTitle" maxlength="40"></label>
          <label class="field" style="margin-top:8px">Texto pequeño<input type="text" id="sSub" maxlength="40"></label>
          <label class="field" style="margin-top:8px">Acabado
            <select id="sStyle"><option value="oro">Dorado</option><option value="plata">Plateado</option><option value="crema">Crema</option></select>
          </label>
        </div>
        <label class="field"><span class="range-row">Tamaño <b id="vSize"></b></span><input type="range" id="sSize" min="0.4" max="3" step="0.05"></label>
        <label class="field"><span class="range-row">Girar (eje vertical) <b id="vYaw"></b></span><input type="range" id="sYaw" min="-180" max="180" step="1"></label>
        <label class="field"><span class="range-row">Rotar sobre su eje <b id="vRoll"></b></span><input type="range" id="sRoll" min="-180" max="180" step="1"></label>
        <label class="field"><span class="range-row">Inclinar <b id="vTilt"></b></span><input type="range" id="sTilt" min="-90" max="90" step="1"></label>
        <label class="check"><input type="checkbox" id="sSpin"> Dar vueltas sin parar</label>
        <div class="row">
          <button class="btn primary" id="sAnchor">Anclar aquí</button>
          <button class="btn" id="sCenter">Traer al centro</button>
          <button class="btn danger" id="sDelete">Borrar</button>
        </div>
      </div>

      <div class="box" id="zoneBox" hidden>
        <h2 id="zHead">Zona</h2>
        <div class="grid2">
          <label class="field">Número<input type="text" id="zNum" maxlength="10"></label>
          <label class="field">Estado
            <select id="zStatus"><option value="disponible">Disponible</option><option value="apartado">Apartado</option><option value="ocupado">Ocupado</option></select>
          </label>
        </div>
        <label class="field">Giro o nombre (opcional)<input type="text" id="zName" maxlength="50" placeholder="Ej. Cafetería, Comida, Artesanías"></label>
        <div class="row">
          <button class="btn" id="zClose">Listo</button>
          <button class="btn danger" id="zDelete">Borrar zona</button>
        </div>
      </div>

      <div class="box" id="setBox" hidden>
        <h2>Esta vista</h2>
        <label class="field">Nombre de la pestaña<input type="text" id="fView" maxlength="30" placeholder="Ej. Escenario"></label>
        <label class="btn" for="panoInput">Subir o cambiar foto 360</label>
        <input id="panoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <p class="note">Cada vista guarda su propia foto, zonas y letreros.</p>
        <label class="field">WhatsApp para informes (con lada)<input type="text" id="fWhats" inputmode="tel" maxlength="24"></label>
        <div class="meter" aria-hidden="true"><i id="meterBar" style="width:0%"></i></div>
        <p class="note" id="meterText"></p>
      </div>

      <div class="box">
        <h2>Zonas del festival</h2>
        <div class="row" id="zCounts"></div>
        <ul class="list" id="list"></ul>
        <p class="empty" id="listEmpty" hidden>Aún no hay zonas marcadas.</p>
        <div class="wa" id="waBox" hidden>
          <a class="btn wine" id="waLink" target="_blank" rel="noopener">Pedir informes por WhatsApp</a>
          <small id="waText"></small>
        </div>
      </div>
    </aside>
  </div>
</div>

<script data-keep>
(function(){
"use strict";
/* ===== estado y regeneración de la página ===== */
const KEEP = Array.from(document.querySelectorAll('[data-keep]'));
const headCss = Array.from(document.head ? document.head.querySelectorAll('style') : []).map(s => s.textContent).find(t => /safe-area-inset/.test(t) && /\[hidden\]/.test(t));
const HEAD_STYLE = headCss || ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
let state;
try { state = JSON.parse(document.getElementById('state').textContent || '{}'); } catch (e) { state = {}; }
state.v = 1;
if (typeof state.whatsapp !== 'string') state.whatsapp = '';
const LOGO = (document.getElementById('logo').textContent || '').trim();

document.getElementById('mount').appendChild(document.getElementById('tpl').content.cloneNode(true));
const $ = id => document.getElementById(id);
const EMBED = /[?&]embed\b/.test(location.search);
if (EMBED) document.documentElement.classList.add('embed');
$('logoImg').src = LOGO;

function buildDoc(){
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  const body = KEEP.map(n => {
    if (n.id === 'state') return '<script id="state" type="application/json" data-keep>' + json + '<\/script>';
    if (n.id === 'mount') return '<div id="mount" data-keep></div>';
    return n.outerHTML;
  }).join('\n');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + HEAD_STYLE + '</style></head><body>' + body + '</body></html>';
}

/* ===== motor 3D ===== */

const pointers = new Map(); let pinch = 0, downAt = null, moved = 0, dragItem = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.drawbar,.zcard,.qbar,.zpin,.hint,.vh')) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  fly = null;
  if (pointers.size === 1) {
    downAt = { x: e.clientX, y: e.clientY }; moved = 0; dragItem = null;
    if (canEditUI() && !drawing) {
      const id = pickItem(e), it = id && V.items.find(x => x.id === id);
      if (it && !it.anchored) { dragItem = it; if (sel !== id) select(id); stage.classList.add('moving'); return; }
    }
    stage.classList.add('dragging');
  } else if (pointers.size === 2) {
    dragItem = null; stage.classList.remove('moving');
    const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); moved = 99;
  }
});
stage.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  if (pointers.size === 1) {
    moved = Math.max(moved, Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y));
    if (dragItem) {
      pointerRay(e); dragItem.dir = d2a(ray.ray.direction.clone().normalize()); placeItem(dragItem); markDirty();
    } else {
      const k = 0.12 * fov / 75;
      lon -= (e.clientX - p.x) * k; lat = Math.max(-89.5, Math.min(89.5, lat + (e.clientY - p.y) * k));
    }
  }
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], dd = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) fov = Math.max(30, Math.min(100, fov + (pinch - dd) * 0.15));
    pinch = dd;
  }
});
function endPtr(e){
  if (!pointers.has(e.pointerId)) return;
  const single = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (!pointers.size) { stage.classList.remove('dragging', 'moving'); pinch = 0; }
  if (dragItem && single) { dragItem = null; renderChrome(); return; }
  if (single && e.type === 'pointerup' && moved < 6) {
    pointerRay(e);
    if (drawing) {
      const hp = ray.intersectObject(pano)[0];
      if (hp) { drawing.push(dirToUV(hp.point.clone().normalize())); renderChrome(); }
      return;
    }
    const id = pickItem(e);
    if (id) { if (canEditUI()) select(id); else { const it = V.items.find(x => x.id === id); if (it) flyTo(it); } return; }
    const zh = ray.intersectObjects(zfills)[0];
    const z = zh && V.zones.find(zz => zz.id === zh.object.userData.zone);
    if (z) selectZone(z.id);
    else { sel = null; selZone = null; renderChrome(); }
  }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => { if (EMBED && !e.ctrlKey) return; e.preventDefault(); fov = Math.max(30, Math.min(100, fov + e.deltaY * 0.04)); }, { passive: false });
function flyTo(it){ flyToDir(new THREE.Vector3(it.dir[0], it.dir[1], it.dir[2])); }
function flyToDir(dv){
  const d = dv.clone().normalize();
  const tl = THREE.MathUtils.radToDeg(Math.atan2(d.z, d.x));
  const dl = ((tl - lon) % 360 + 540) % 360 - 180;
  fly = { lon: lon + dl, lat: Math.max(-85, Math.min(85, 90 - THREE.MathUtils.radToDeg(Math.acos(d.y)) - 4)) };
}

/* ===== pestañas de vistas ===== */
function visibleViews(){
  return state.views.map((v, i) => ({ v, i })).filter(o => canEditUI() || o.i === 0 || o.v.pano || o.v.zones.length || o.v.items.length);
}
function renderTabs(){
  const nav = $('vtabs'); nav.innerHTML = '';
  const list = visibleViews();
  nav.hidden = list.length < 2;
  list.forEach(({ v, i }) => {
    const b = document.createElement('button');
    b.className = 'vtab'; b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', v === V ? 'true' : 'false');
    const t = document.createElement('span'); t.textContent = v.name || ('Vista ' + (i + 1)); b.appendChild(t);
    if (canEditUI() && !v.pano) { const d = document.createElement('small'); d.textContent = 'sin foto'; b.appendChild(d); }
    b.onclick = () => { if (v !== V) switchView(i); };
    nav.appendChild(b);
  });
}
function switchView(i){
  V = state.views[i] || state.views[0];
  drawing = null; sel = null; selZone = null; fly = null;
  objs.forEach((rec, id) => removeItem(id));
  lon = 45; lat = -30; fov = 80;
  setPano(); rebuildAll(); renderChrome();
}
$('fView').addEventListener('input', () => { V.name = $('fView').value.trim() || 'Vista'; markDirty(); $('saveBox').hidden = !art; renderTabs(); });

/* ===== esquinas editables de las zonas ===== */
let vhEls = [], vhDrag = null, zonesDirty = false;
function handlePts(){
  if (!canEditUI()) return null;
  if (drawing) return drawing;
  const z = V.zones.find(x => x.id === selZone);
  return z ? z.pts : null;
}
function renderHandles(){
  const box = $('vhandles'); box.innerHTML = ''; vhEls = [];
  const pts = handlePts(); if (!pts) return;
  pts.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'vh'; b.type = 'button';
    b.setAttribute('aria-label', 'Esquina ' + (i + 1) + ': arrastra para ajustarla');
    b.addEventListener('pointerdown', e => {
      e.stopPropagation(); e.preventDefault();
      b.setPointerCapture(e.pointerId); vhDrag = { i, el: b, moved: false }; b.classList.add('active');
    });
    b.addEventListener('pointermove', e => {
      if (!vhDrag || vhDrag.el !== b) return;
      pointerRay(e);
      const hp = ray.intersectObject(pano)[0]; if (!hp) return;
      const cur = handlePts(); if (!cur) return;
      cur[i] = dirToUV(hp.point.clone().normalize());
      vhDrag.moved = true; zonesDirty = true;
    });
    const end = () => {
      if (!vhDrag || vhDrag.el !== b) return;
      const mv = vhDrag.moved; vhDrag = null; b.classList.remove('active');
      if (mv) { if (!drawing) { markDirty(); $('saveBox').hidden = !art; } drawOverlay(); renderZPins(); }
    };
    b.addEventListener('pointerup', end);
    b.addEventListener('pointercancel', end);
    b.addEventListener('click', e => e.stopPropagation());
    box.appendChild(b);
    vhEls.push({ el: b, i });
  });
}
const vhv = new THREE.Vector3();
function placeHandles(){
  if (!vhEls.length) return;
  const pts = handlePts(); if (!pts) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  vhEls.forEach(v => {
    const p = pts[v.i]; if (!p) { v.el.hidden = true; return; }
    uvToDir(p[0], p[1], vhv).multiplyScalar(ZR).project(camera);
    const vis = vhv.z < 1 && Math.abs(vhv.x) < 1.1 && Math.abs(vhv.y) < 1.1;
    v.el.hidden = !vis;
    if (vis) v.el.style.transform = 'translate(' + ((vhv.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - vhv.y) / 2 * h).toFixed(1) + 'px)';
  });
}

/* ===== controles rápidos junto al elemento ===== */
const QAX = {
  roll: { min: -180, max: 180, step: 1, inc: 15, fmt: v => Math.round(v) + '°' },
  yaw:  { min: -180, max: 180, step: 1, inc: 15, fmt: v => Math.round(v) + '°' },
  tilt: { min: -90, max: 90, step: 1, inc: 10, fmt: v => Math.round(v) + '°' },
  size: { min: 0.4, max: 3, step: 0.05, inc: 0.1, fmt: v => Math.round(v * 100) + '%' }
};
let qAxis = 'roll';
const qbar = $('qbar');
function qItem(){ return canEditUI() ? V.items.find(x => x.id === sel) : null; }
function syncQbar(){
  const it = qItem();
  qbar.hidden = !it || !!drawing;
  if (!it) return;
  const a = QAX[qAxis], v = qAxis === 'size' ? (it.size || 1) : (it[qAxis] || 0);
  qbar.querySelectorAll('.qax').forEach(b => b.setAttribute('aria-pressed', b.dataset.ax === qAxis ? 'true' : 'false'));
  const r = $('qRange'); r.min = a.min; r.max = a.max; r.step = a.step; r.value = v;
  $('qVal').textContent = a.fmt(v);
  $('qAnchor').textContent = it.anchored ? 'Mover' : 'Anclar';
  $('qAnchor').className = it.anchored ? 'btn' : 'btn primary';
  $('qSpin').setAttribute('aria-pressed', it.spin ? 'true' : 'false');
}
function qSet(v){
  const it = qItem(); if (!it) return;
  const a = QAX[qAxis];
  v = Math.max(a.min, Math.min(a.max, v));
  it[qAxis] = +(+v).toFixed(2); placeItem(it); markDirty(); $('saveBox').hidden = !art;
  syncQbar(); renderSel();
}
qbar.addEventListener('pointerdown', e => e.stopPropagation());
qbar.querySelectorAll('.qax').forEach(b => b.onclick = () => { qAxis = b.dataset.ax; syncQbar(); });
$('qRange').addEventListener('input', () => qSet(parseFloat($('qRange').value)));
function wrapStep(dir){
  const it = qItem(); if (!it) return;
  const a = QAX[qAxis]; let v = (qAxis === 'size' ? (it.size || 1) : (it[qAxis] || 0)) + dir * a.inc;
  if (qAxis === 'roll' || qAxis === 'yaw') { if (v > 180) v -= 360; if (v < -180) v += 360; }
  qSet(v);
}
$('qMinus').onclick = () => wrapStep(-1);
$('qPlus').onclick = () => wrapStep(1);
$('qAnchor').onclick = () => $('sAnchor').click();
$('qSpin').onclick = () => { const it = qItem(); if (!it) return; it.spin = !it.spin; markDirty(); $('saveBox').hidden = !art; syncQbar(); renderSel(); };
$('qClose').onclick = () => select(null);
const qv = new THREE.Vector3();
function placeQbar(){
  if (qbar.hidden) return;
  const rec = objs.get(sel); if (!rec || !rec.group) return;
  const sw = stage.clientWidth, sh = stage.clientHeight, bw = qbar.offsetWidth, bh = qbar.offsetHeight;
  qv.copy(rec.group.position).project(camera);
  let x, y;
  if (qv.z < 1 && Math.abs(qv.x) < 1.2 && Math.abs(qv.y) < 1.2) {
    x = (qv.x + 1) / 2 * sw - bw / 2;
    y = (1 - qv.y) / 2 * sh + Math.min(130, sh * 0.16);
    if (y + bh > sh - 10) y = (1 - qv.y) / 2 * sh - Math.min(130, sh * 0.16) - bh;
  } else { x = (sw - bw) / 2; y = sh - bh - 10; }
  x = Math.max(10, Math.min(sw - bw - 10, x)); y = Math.max(10, Math.min(sh - bh - 10, y));
  qbar.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
}

/* ===== bucle ===== */
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const target = new THREE.Vector3(), tmpV = new THREE.Vector3();
let last = performance.now(), t = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (fly) {
    const k = reduce ? 1 : Math.min(1, dt * 5);
    lon += (fly.lon - lon) * k; lat += (fly.lat - lat) * k;
    if (Math.abs(fly.lon - lon) < 0.05 && Math.abs(fly.lat - lat) < 0.05) fly = null;
  }
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 8); camera.updateProjectionMatrix();
  const ph = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon);
  target.set(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
  camera.lookAt(target);
  shineMats.forEach(m => { m.uniforms.time.value = reduce ? 0.3 : t; m.uniforms.shine.value = reduce ? 0 : 1; });
  if (!reduce) objs.forEach(rec => {
    if (!rec.inner) return;
    rec.inner.position.y = Math.sin(t * 1.1 + rec.phase) * 2.2;
    rec.inner.rotation.y = rec.it && rec.it.spin ? t * 0.9 + rec.phase : Math.sin(t * 0.55 + rec.phase) * 0.16;
    rec.inner.rotation.x = Math.sin(t * 0.4 + rec.phase * 1.3) * 0.03;
  });
  renderer.render(scene, camera);
  placeQbar();
  if (zonesDirty) { zonesDirty = false; drawOverlay(); }
  placeHandles();
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  for (const p of zpinEls) {
    tmpV.copy(p.pos).project(camera);
    const vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.05 && Math.abs(tmpV.y) < 1.05;
    p.el.hidden = !vis;
    if (vis) { p.el.style.left = ((tmpV.x + 1) / 2 * w) + 'px'; p.el.style.top = ((1 - tmpV.y) / 2 * h) + 'px'; }
  }
}

setPano();
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all([document.fonts.load('700 128px "Playfair Display"'), document.fonts.load('600 40px "Work Sans"')]), new Promise(r => setTimeout(r, 2500))])
  : Promise.resolve();
rebuildAll();
fontsReady.then(() => rebuildAll()).catch(() => {});
renderChrome();
requestAnimationFrame(loop);

/* ===== versión pública: sin edición; modo incrustado en la página ===== */
if (EMBED) {
  const post = () => { try { parent.postMessage({ type: 'ficc360-height', h: Math.ceil(document.querySelector('.app').getBoundingClientRect().height) }, '*'); } catch (e) {} };
  new ResizeObserver(post).observe(document.querySelector('.app')); post();
}
})();
</script>
</body></html>
